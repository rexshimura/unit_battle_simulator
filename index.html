<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Rexshimura">
    <meta name="description" content="A web-based battle simulator where users can place and pit various units against each other in real-time.">

    <title>Unit Battle Simulator</title>

    <link rel="icon" type="image/x-icon" href="icon/app.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="unit-tooltip" class="glass-panel"></div>
    <div id="inspect-tooltip" class="glass-panel"></div>
    
    <div id="stats-panel" class="glass-panel">
        <div class="flex justify-between items-center mb-4 flex-shrink-0">
            <h2 class="text-xl font-bold text-violet-300">Battle Statistics</h2>
            <button id="close-stats-btn" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="stats-panel-content" class="overflow-y-auto flex-grow">
            </div>
    </div>


    <div id="game-container" class="w-full h-full flex flex-col p-4 gap-4">
        <div class="glass-panel p-4 w-full flex-shrink-0 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 id="version-header" class="text-2xl font-bold text-violet-300">Unit Battle Simulator</h1>
            </div>
            <div class="text-right flex gap-4 items-center">
                <button id="inspect-unit-btn" data-tooltip-title="Inspect Unit" data-tooltip-desc="Hover over or click a unit to see its detailed stats in real-time." class="action-btn p-2 rounded-full bg-gray-700 hover:bg-gray-600 shadow-lg text-white flex items-center gap-2 px-3">
                     <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                     <span class="text-xs text-gray-400 font-mono -ml-1">[Q]</span>
                </button>
                
                <button id="show-stats-btn" data-tooltip-title="Battle Statistics" data-tooltip-desc="Opens a panel showing detailed performance stats for all units in the battle." class="action-btn p-2 rounded-full bg-gray-700 hover:bg-gray-600 shadow-lg text-white flex items-center gap-2 px-3">
                     <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                     <span class="text-xs text-gray-400 font-mono -ml-1">[S]</span>
                </button>

                <button id="toggle-range-btn" data-tooltip-title="Toggle Range Preview" data-tooltip-desc="Shows or hides the attack range circles for all units on the battlefield." class="action-btn p-2 rounded-full bg-gray-700 hover:bg-gray-600 shadow-lg text-white flex items-center gap-2 px-3">
                    <img id="eye-icon" src="icon/icon_eye_open.svg" alt="Eye Open" class="w-6 h-6 hidden pointer-events-none">
                    <img id="eye-off-icon" src="icon/icon_eye_closed.svg" alt="Eye Closed" class="w-6 h-6 pointer-events-none">
                    <span class="text-xs text-gray-400 font-mono -ml-1">[R]</span>
                </button>

                <button id="remove-unit-btn" data-tooltip-title="Remove Unit" data-tooltip-desc="Activates remove mode. Click on a unit on the field to delete it." class="action-btn remove p-2 rounded-full bg-gray-700 hover:bg-gray-600 shadow-lg text-white flex items-center gap-2 px-3">
                    <img src="icon/icon_remove.svg" alt="Remove" class="w-6 h-6 pointer-events-none">
                    <span class="text-xs text-gray-400 font-mono -ml-1">[X]</span>
                </button>

                <p class="text-lg font-bold text-blue-400">Blue: <span id="blue-count">0</span></p>
                <p class="text-lg font-bold text-red-400">Red: <span id="red-count">0</span></p>
            </div>
        </div>

        <div class="w-full flex-grow flex flex-col md:flex-row gap-4 min-h-0">
            <div id="side-panel" class="glass-panel p-6 w-full md:w-72 flex flex-col">
                <div id="side-panel-header" class="flex justify-between items-center mb-4 border-b border-gray-600 pb-2 flex-shrink-0">
                    <h2 class="text-sm font-bold side-panel-title uppercase tracking-widest text-gray-400">Place Units</h2>
                    <div class="flex gap-2">
                        <button id="view-toggle-btn" class="p-1 rounded bg-gray-700 hover:bg-gray-600 transition-colors" title="Toggle Grid/List View">
                        <svg id="view-icon-list" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        <svg id="view-icon-grid" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    </button>
                        <button id="collapse-btn" class="p-1 rounded bg-gray-700 hover:bg-gray-600 transition-all" title="Toggle Sidebar">
                            <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                    </div>
                </div>
                
                <div id="role-sorter" class="flex justify-between gap-1 mb-4 border-b border-gray-600 pb-2">
                     <button data-role="all" class="role-btn p-1.5 rounded-full flex-shrink-0 selected" data-tooltip-title="All Units" data-tooltip-desc="Show all available units.">
                        <img src="icon/icon_all.svg" alt="All" class="w-5 h-5 pointer-events-none">
                    </button>
                    <button data-role="Melee" class="role-btn p-1.5 rounded-full flex-shrink-0" data-tooltip-title="Melee Units" data-tooltip-desc="Filter for units that fight up close.">
                        <img src="icon/icon_melee.svg" alt="Melee" class="w-5 h-5 pointer-events-none">
                    </button>
                    <button data-role="Ranged" class="role-btn p-1.5 rounded-full flex-shrink-0" data-tooltip-title="Ranged Units" data-tooltip-desc="Filter for units that attack from a distance.">
                        <img src="icon/icon_range.svg" alt="Ranged" class="w-5 h-5 pointer-events-none">
                    </button>
                    <button data-role="Tank" class="role-btn p-1.5 rounded-full flex-shrink-0" data-tooltip-title="Tank Units" data-tooltip-desc="Filter for durable units that absorb damage.">
                        <img src="icon/icon_tank.svg" alt="Tank" class="w-5 h-5 pointer-events-none">
                    </button>
                    <button data-role="Magic" class="role-btn p-1.5 rounded-full flex-shrink-0" data-tooltip-title="Magic Units" data-tooltip-desc="Filter for spellcasting units.">
                        <img src="icon/icon_magic.svg" alt="Magic" class="w-5 h-5 pointer-events-none">
                    </button>
                    <button data-role="Support" class="role-btn p-1.5 rounded-full flex-shrink-0" data-tooltip-title="Support Units" data-tooltip-desc="Filter for units that heal or support allies.">
                        <img src="icon/icon_support.svg" alt="Support" class="w-5 h-5 pointer-events-none">
                    </button>

                </div>
                <div class="space-y-3 unit-list flex-grow min-h-0 overflow-y-auto pr-2">
                    <button data-unit-type="swordsman" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="swordsman"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Swordsman</p>
                        </div>
                    </button>
                    <button data-unit-type="fortress" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="fortress"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Fortress</p>
                        </div>
                    </button>
                    <button data-unit-type="guardian" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="guardian"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Guardian</p>
                        </div>
                    </button>
                     <button data-unit-type="spearman" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="spearman"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Spearman</p>
                        </div>
                    </button>
                    <button data-unit-type="musketeer" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="musketeer"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Musketeer</p>
                        </div>
                    </button>
                    <button data-unit-type="sniper" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="sniper"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Sniper</p>
                        </div>
                    </button>
                    <button data-unit-type="archer" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="archer"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Archer</p>
                        </div>
                    </button>
                     <button data-unit-type="cryomancer" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="cryomancer"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Cryomancer</p>
                        </div>
                    </button>
                    <button data-unit-type="flamecaller" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="flamecaller"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Flamecaller</p>
                        </div>
                    </button>
                     <button data-unit-type="wizard" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="wizard"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Wizard</p>
                        </div>
                    </button>

                    <button data-unit-type="priest" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="priest"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Priest</p>
                        </div>
                    </button>
                    <button data-unit-type="bard" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="bard"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Bard</p>
                        </div>
                    </button>
                    <button data-unit-type="druid" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="druid"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Druid</p>
                        </div>
                    </button>
                    <button data-unit-type="alchemist" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="alchemist"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Alchemist</p>
                        </div>
                    </button>
                    <button data-unit-type="sledgehammer" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="sledgehammer"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Sledgehammer</p>
                        </div>
                    </button>
                    <button data-unit-type="duelist" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="duelist"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Duelist</p>
                        </div>
                    </button>
                    <button data-unit-type="rockgolem" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="rockgolem"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Rock Golem</p>
                        </div>
                    </button>
                    <button data-unit-type="troll" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="troll"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Troll</p>
                        </div>
                    </button>

                    <div id="unique-separator" class="col-span-full flex items-center gap-2 py-2 mt-2 w-full hidden">
                        <div class="h-px bg-gray-600 flex-grow"></div>
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Unique</span>
                        <div class="h-px bg-gray-600 flex-grow"></div>
                    </div>
                    <button data-unit-type="assassin" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="assassin"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Assassin</p>
                        </div>
                    </button>
                    <button data-unit-type="ghoul" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="ghoul"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Ghoul</p>
                        </div>
                    </button>
                    <button data-unit-type="abyssal_summoner" class="unit-btn w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 flex items-center gap-3">
                        <canvas width="40" height="40" class="unit-preview-canvas" data-unit-type="abyssal_summoner"></canvas>
                        <div>
                            <p class="text-sm font-bold text-gray-200">Abyssal Summoner</p>
                        </div>
                    </button>
                </div>
                <div class="mt-auto flex-shrink-0">
                    <div class="mt-6 pt-4 border-t border-gray-600 flex justify-around items-center controls-row">
                         <button id="start-battle-btn" data-tooltip-title="Start / Stop Battle" data-tooltip-desc="Start the simulation. Click again while running to stop and completely clear the field." class="action-btn p-3 rounded-full bg-green-600 hover:bg-green-500 shadow-lg text-white">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                         </button>
                         <button id="pause-btn" data-tooltip-title="Pause / Resume" data-tooltip-desc="Pause or resume the current battle simulation." class="action-btn p-3 rounded-full bg-yellow-600 hover:bg-yellow-500 shadow-lg text-white">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                         </button>
                         <button id="reset-btn" data-tooltip-title="Reset Positions" data-tooltip-desc="Resets all units to their positions at the start of the last battle." class="action-btn p-3 rounded-full bg-red-600 hover:bg-red-500 shadow-lg text-white">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                         </button>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-600">
                        <h3 class="text-lg font-bold mb-2 text-center speed-title">Game Speed</h3>
                        <div id="speed-controls" class="grid grid-cols-4 gap-2">
                            <button class="speed-btn action-btn p-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-xs" data-speed="0.5">0.5x</button>
                            <button class="speed-btn action-btn p-2 rounded-lg bg-gray-700 hover:bg-gray-600 selected text-xs" data-speed="1.0">1.0x</button>
                            <button class="speed-btn action-btn p-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-xs" data-speed="1.5">1.5x</button>
                            <button class="speed-btn action-btn p-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-xs" data-speed="2.0">2.0x</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="canvas-container" class="relative flex-grow">
                <canvas id="gameCanvas" class="w-full h-full"></canvas>
                <div id="selection-message" class="status-message absolute top-5 left-5 text-lg font-bold text-violet-300 pointer-events-none opacity-0 transition-opacity"></div>
                <div id="status-message" class="status-message absolute inset-0 flex items-center justify-center text-5xl font-bold text-white pointer-events-none opacity-0 transition-opacity"></div>
                <div id="remove-message" class="status-message absolute top-5 inset-x-0 flex items-center justify-center text-2xl font-bold text-red-400 pointer-events-none opacity-0 transition-opacity"></div>
                <div id="inspect-message" class="status-message absolute top-5 inset-x-0 flex items-center justify-center text-2xl font-bold text-violet-300 pointer-events-none opacity-0 transition-opacity"></div>
                <button id="stop-tracking-btn" class="hidden absolute top-4 right-4 action-btn bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-full">Stop Tracking</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
